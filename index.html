<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABAY02 - All in One Downloader</title>
<style>
:root{--red:#fe2c55;--bg:#000;--card:#141414;--border:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;text-align:center}
.logo{width:110px;height:110px;border-radius:20px;margin:18px auto 8px;display:block;box-shadow:0 0 25px rgba(254,44,85,.4)}
h1{color:var(--red);font-size:34px;margin:5px 0;font-weight:900}h1 span{color:#fff}
.sub{color:#777;font-size:13px}
.tabs{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px}
.tab{padding:10px 16px;border-radius:22px;border:1px solid var(--border);background:#111;color:#fff;cursor:pointer;font-size:12px}
.tab.active{background:var(--red);border-color:var(--red);font-weight:bold}
.box{max-width:560px;margin:0 auto;padding:0 14px}
input{width:100%;padding:17px;border-radius:13px;border:2px solid var(--border);background:var(--card);color:#fff;font-size:15px;outline:none}
input:focus{border-color:var(--red)}
.btn{width:100%;padding:17px;border-radius:13px;border:none;background:var(--red);color:#fff;font-size:17px;font-weight:900;margin-top:11px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin:16px auto;max-width:560px;text-align:left;word-break:break-word}
video{width:100%;border-radius:12px;background:#000;margin-top:10px}
.down{display:block;background:#fff;color:#000;padding:14px;border-radius:11px;text-align:center;font-weight:900;text-decoration:none;margin-top:11px}
.small{font-size:12px;color:#777}
.flex{display:flex;gap:8px;margin-top:10px} .flex button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--border);background:#000;color:#fff;cursor:pointer}
</style>
</head>
<body>
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<h1>ABAY<span>02</span></h1>
<div class="sub">TikTok • Instagram • Facebook • YouTube • No Watermark</div>

<div class="tabs">
<button class="tab active" onclick="setT('tiktok',this)">TikTok</button>
<button class="tab" onclick="setT('insta',this)">Instagram</button>
<button class="tab" onclick="setT('fb',this)">Facebook</button>
<button class="tab" onclick="setT('yt',this)">YouTube</button>
</div>

<div class="box">
<input id="url" placeholder="Paste ANY link here...">
<button class="btn" onclick="download()">DOWNLOAD NOW ⬇️</button>
<div class="flex"><button onclick="paste()">📋 Paste</button><button onclick="clearAll()">✖ Clear</button><button onclick="shareSite()">🔗 Share</button></div>
</div>

<div id="result"></div>
<p class="small">© 2026 ABAY02 | Made in PH | abayben2010@gmail.com</p>

<script>
let type='tiktok';
function setT(t,el){type=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); el.classList.add('active');}
async function paste(){try{let txt=await navigator.clipboard.readText(); document.getElementById('url').value=txt;}catch(e){}}
function clearAll(){document.getElementById('url').value=''; document.getElementById('result').innerHTML='';}
function shareSite(){navigator.clipboard.writeText(location.href); alert("ABAY02 link copied!");}

 let res=document.getElementById('result');

     body: JSON.stringify({url: url, vQuality: "720", filenamePattern: "basic"})
   });
   let data = await apiRes.json();
   
   if(data.url){
     let dl = data.url;
     let isVideo = dl.includes('.mp4') || data.status === 'redirect' || data.status === 'tunnel';

     } else {
       res.innerHTML = `<div class="card">✅ Link ready!<br><a class="down" href="${dl}" target="_blank">⬇️ DOWNLOAD NOW</a></div>`;
     }
   } else if(data.status === 'error'){
     res.innerHTML = `<div class="card">❌ ${data.error?.code || 'Failed'} - ${data.text || 'Try another link'}<br><br><small>Tip: Make sure link is
